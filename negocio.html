<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Documento interno de Fearless Unlimited.">
<meta name="robots" content="noindex">
<title>Estudios Fearless</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: archivo de estudios internos, protegido con clave, con una pestaña por estudio y cada estudio como informe de una columna de lectura. Antes de entrar se ve solo la tarjeta de acceso; el contenido va cifrado en la página y se descifra en el navegador. Mismo mundo visual que la landing y la propuesta. */
:root {
  color-scheme: dark;
  --ink: #0f0c0c;
  --ink-2: #181313;
  --ink-3: #241c1b;
  --line: #3b2d2b;
  --rice: #f3ece2;
  --muted: #ab9d93;
  --shu: #c0201c;
  --shu-hi: #ff6b5e;
  --ok: #6fcf8e;
  --mid: #e8b04a;
  --display: "Dela Gothic One", "Zen Kaku Gothic New", system-ui, sans-serif;
  --body: "Zen Kaku Gothic New", system-ui, -apple-system, "Segoe UI", sans-serif;
  --gutter: clamp(16px, 4vw, 40px);
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { margin: 0; background: var(--ink); color: var(--rice); font-family: var(--body); font-size: 17px; line-height: 1.65; -webkit-font-smoothing: antialiased; }
img { max-width: 100%; display: block; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; line-height: 1.12; text-wrap: balance; margin: 0; }
p { margin: 0; }
a { color: var(--shu-hi); }
:focus-visible { outline: 2px solid var(--shu-hi); outline-offset: 2px; }
.wrap { max-width: 1040px; margin-inline: auto; padding-inline: var(--gutter); }
.eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--shu-hi); font-weight: 700; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: color-mix(in srgb, var(--ink) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.bar .fu { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; color: var(--rice); text-decoration: none; }
.bar .fu img { width: 24px; height: 24px; }
.bar .spacer { flex: 1; }
.bar .back { font-size: 14px; font-weight: 700; text-decoration: none; border-radius: 999px; padding: 6px 14px; box-shadow: inset 0 0 0 1.5px var(--line); color: var(--rice); white-space: nowrap; }
.bar .back:hover { box-shadow: inset 0 0 0 1.5px var(--rice); }

.cover { padding-block: clamp(40px, 7vw, 88px) 40px; border-bottom: 1px solid var(--line); }
.cover h1 { font-size: clamp(32px, 5.6vw, 62px); max-width: 18ch; margin-top: 14px; }
.cover h1 em { font-style: normal; color: var(--shu-hi); }
.cover .lede { margin-top: 20px; font-size: clamp(17px, 2.1vw, 20px); color: var(--muted); max-width: 60ch; }
.cover .meta { margin-top: 20px; font-size: 14px; color: var(--muted); }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); border-bottom: 1px solid var(--line); }
.stats div { padding: 26px 20px 26px 0; display: grid; gap: 4px; align-content: start; }
.stats b { font-family: var(--display); font-weight: 400; font-size: clamp(28px, 3.6vw, 38px); line-height: 1.1; }
.stats span { color: var(--muted); font-size: 15px; }

section { padding-block: clamp(44px, 6vw, 80px); border-bottom: 1px solid var(--line); }
.sec-title { display: grid; gap: 10px; margin-bottom: 28px; }
.sec-title h2 { font-size: clamp(26px, 3.8vw, 40px); }
.sec-title p { color: var(--muted); max-width: 64ch; }

.findings { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 14px; }
.finding { background: var(--ink-2); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; display: grid; gap: 6px; align-content: start; }
.finding h3 { font-family: var(--body); font-weight: 700; font-size: 17px; }
.finding p { color: var(--muted); font-size: 15px; }

.ideas { display: grid; gap: 16px; }
.idea { background: var(--ink-2); border: 1px solid var(--line); border-radius: 14px; padding: clamp(18px, 3vw, 28px); display: grid; gap: 14px; }
.idea.fav { border-color: color-mix(in srgb, var(--shu) 60%, var(--line)); }
.idea .head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.idea h3 { font-size: clamp(20px, 2.6vw, 26px); flex: 1 1 260px; }
.tag { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 3px 10px; white-space: nowrap; background: var(--ink-3); color: var(--muted); }
.tag.fav { background: var(--shu); color: var(--rice); }
.v { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 3px 10px; white-space: nowrap; border: 1.5px solid currentColor; }
.v.alta { color: var(--ok); }
.v.media { color: var(--mid); }
.v.baja { color: var(--shu-hi); }
.idea .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px 28px; }
.idea h4 { margin: 0 0 6px; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.idea ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 15px; }
.idea li::marker { color: var(--shu-hi); }
.idea .rec { border-top: 1px dashed var(--line); padding-top: 12px; font-size: 15px; }
.idea .rec b { color: var(--shu-hi); }

.money { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 760px) { .money { grid-template-columns: 1fr; } }
.ledger { background: var(--ink-2); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 4px; align-content: start; }
.ledger.direct { border: 1.5px solid var(--shu); background: color-mix(in srgb, var(--shu) 8%, var(--ink)); }
.ledger h3 { font-size: 19px; margin-bottom: 8px; }
.ledger .row { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 15px; }
.ledger .row span:last-child { font-variant-numeric: tabular-nums; white-space: nowrap; }
.ledger .row.total { border-bottom: 0; font-weight: 700; font-size: 17px; }
.ledger .row.total span:last-child { font-family: var(--display); font-weight: 400; }
.ledger small { color: var(--muted); font-size: 13px; margin-top: 6px; }
.note { margin-top: 16px; color: var(--muted); font-size: 15px; max-width: 70ch; }

.phases { display: grid; gap: 14px; }
.phase { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 24px; background: var(--ink-2); border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
.phase .k { display: grid; gap: 4px; align-content: start; }
.phase .k b { font-family: var(--display); font-weight: 400; font-size: 15px; color: var(--shu-hi); }
.phase .k span { font-size: 13px; color: var(--muted); }
.phase h3 { font-size: 21px; margin-bottom: 8px; }
.phase p { color: var(--muted); }
.phase ul { margin: 12px 0 0; padding-left: 20px; display: grid; gap: 4px; font-size: 15px; }
.phase li::marker { color: var(--shu-hi); }
.phase.now { border-color: var(--shu); }
@media (max-width: 640px) { .phase { grid-template-columns: 1fr; gap: 10px; } }

.check { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 0 32px; padding: 0; margin: 0; list-style: none; }
.check li { padding: 12px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 26px 1fr; gap: 6px; }
.check li::before { content: "□"; color: var(--shu-hi); font-weight: 700; }
.check small { display: block; color: var(--muted); font-size: 14px; }

.sources { margin: 0; padding-left: 20px; display: grid; gap: 8px; font-size: 15px; color: var(--muted); }
.sources a { overflow-wrap: anywhere; }
footer { padding-block: 24px 40px; color: var(--muted); font-size: 13px; }

.acceso { min-height: calc(100dvh - 60px); display: grid; place-items: center; padding: 40px var(--gutter); }
.acceso form { width: min(100%, 380px); background: var(--ink-2); border: 1px solid var(--line); border-radius: 16px; padding: 28px 24px; display: grid; gap: 14px; }
.acceso h1 { font-size: 26px; }
.acceso p { color: var(--muted); font-size: 15px; }
.acceso label { font-size: 14px; font-weight: 700; }
.acceso input { width: 100%; font: inherit; color: var(--rice); background: var(--ink); border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.acceso input:focus { border-color: var(--rice); outline: none; }
.acceso button { font: inherit; font-weight: 700; color: var(--rice); background: var(--shu); border: 0; border-radius: 999px; padding: 12px 20px; cursor: pointer; }
.acceso button:disabled { opacity: .6; cursor: wait; }
.acceso .error { color: var(--shu-hi); font-size: 14px; min-height: 1.4em; }

/* Archivo de estudios: una pestaña por estudio, armadas por scripts/cifrar-negocio.js. */
.tabs { border-bottom: 1px solid var(--line); background: var(--ink); }
.tabs .wrap { display: flex; gap: 6px; overflow-x: auto; padding-block: 12px; scrollbar-width: none; }
.tabs .wrap::-webkit-scrollbar { display: none; }
.tabs a { flex: none; font-size: 14px; font-weight: 700; text-decoration: none; color: var(--muted); border-radius: 999px; padding: 7px 16px; box-shadow: inset 0 0 0 1.5px var(--line); white-space: nowrap; }
.tabs a:hover { color: var(--rice); box-shadow: inset 0 0 0 1.5px var(--rice); }
.tabs a[aria-current="page"] { color: var(--rice); background: var(--shu); box-shadow: none; }
.estudio section { scroll-margin-top: 64px; }

.tabla { width: 100%; border-collapse: collapse; font-size: 15px; }
.tabla th, .tabla td { text-align: left; padding: 10px 12px 10px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.tabla th { font-size: 13px; color: var(--muted); font-weight: 700; }
.tabla td.n, .tabla th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tabla tr.total td { font-weight: 700; border-bottom: 0; }
.tabla-scroll { overflow-x: auto; }
.tabla.ancha { min-width: 600px; }
.ledger .row.sub { color: var(--muted); font-size: 14px; }
.ledger .tag { justify-self: start; margin-bottom: 6px; }

.calc { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 760px) { .calc { grid-template-columns: 1fr; } }
.calc fieldset { margin: 0; background: var(--ink-2); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; display: grid; gap: 12px; align-content: start; }
.calc legend { font-family: var(--display); font-size: 18px; padding: 0 6px; }
.calc label { display: grid; grid-template-columns: minmax(0, 1fr) 130px; align-items: center; gap: 12px; font-size: 15px; }
.calc input { width: 100%; font: inherit; font-variant-numeric: tabular-nums; text-align: right; color: var(--rice); background: var(--ink); border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.calc input:focus { border-color: var(--rice); outline: none; }
.calc output { display: flex; justify-content: space-between; gap: 12px; border-top: 1px dashed var(--line); padding-top: 10px; font-size: 15px; }
.calc output b { font-family: var(--display); font-weight: 400; font-size: 20px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.calc output.main b { color: var(--shu-hi); font-size: 24px; }

/* Selector "¿Cómo cobro?" (skill cobro-servicios): los montos con data-monto siguen al régimen elegido. */
.cobro-grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .cobro-grid { grid-template-columns: 1fr; } }
.cobro-selector fieldset { margin: 0; border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; display: grid; gap: 10px; background: var(--ink-2); }
.cobro-selector legend { font-family: var(--display); font-size: 18px; padding: 0 6px; }
.cobro-op { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; align-items: start; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); cursor: pointer; }
.cobro-op:has(input:checked) { border-color: var(--shu); background: color-mix(in srgb, var(--shu) 10%, transparent); }
.cobro-op input { margin: 4px 0 0; accent-color: var(--shu); width: 18px; height: 18px; }
.cobro-op b { display: block; font-size: 15px; }
.cobro-op small { display: block; color: var(--muted); font-size: 14px; line-height: 1.5; }
.cobro-tasas { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; font-size: 14px; }
.cobro-tasas label { display: inline-flex; align-items: center; gap: 8px; }
.cobro-tasas input { width: 84px; font: inherit; font-variant-numeric: tabular-nums; text-align: right; color: var(--rice); background: var(--ink); border: 1.5px solid var(--line); border-radius: 8px; padding: 6px 8px; }
.cobro-tasas input:focus { border-color: var(--rice); outline: none; }
.cobro-tasas button { font: inherit; font-size: 13px; font-weight: 700; color: var(--rice); background: none; border: 0; border-radius: 999px; padding: 6px 12px; box-shadow: inset 0 0 0 1.5px var(--line); cursor: pointer; }
.cobro-tasas button:hover { box-shadow: inset 0 0 0 1.5px var(--rice); }
.cobro-grid .note { margin-top: 12px; }
[data-monto] { font-variant-numeric: tabular-nums; white-space: nowrap; }
</style>
</head>
<body>

<div class="bar">
  <div class="wrap">
    <a class="fu" href="negocio.html"><img src="img/fearless-unlimited.png" alt="" width="24" height="24">Fearless Unlimited</a>
    <span class="spacer"></span>
    <a class="back" href="./">← Volver a la landing</a>
  </div>
</div>

<main>
<div id="protegido">
<div class="acceso">
  <form id="formAcceso" autocomplete="off">
    <p class="eyebrow">Documento interno</p>
    <h1>Estudios Fearless</h1>

    <label for="clave">Clave</label>
    <input id="clave" type="password" autocomplete="current-password" required autofocus>
    <p class="error" id="errorAcceso" role="alert"></p>
    <button type="submit" id="entrar">Entrar</button>
  </form>
</div>

<script>
(() => {
  const paquete = JSON.parse(document.getElementById("paquete").textContent);
  const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const GUARDADA = "negocio-llave-v" + paquete.v + "-" + paquete.sal;
  const form = document.getElementById("formAcceso");
  const error = document.getElementById("errorAcceso");
  const boton = document.getElementById("entrar");

  async function abrir(llave) {
    const plano = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(paquete.iv) }, llave, bytes(paquete.datos));
    document.getElementById("protegido").outerHTML = new TextDecoder().decode(plano);
    document.dispatchEvent(new Event("protegido:abierto"));
  }

  async function llaveDesdeClave(clave) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(clave), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt: bytes(paquete.sal), iterations: paquete.iter, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
  }

  if (!window.crypto?.subtle) {
    error.textContent = "Este navegador no puede abrir el documento. Ábrelo desde la dirección https del sitio.";
    boton.disabled = true;
    return;
  }

  (async () => {
    let guardada = null;
    try { guardada = sessionStorage.getItem(GUARDADA); } catch {}
    if (!guardada) return;
    try {
      const llave = await crypto.subtle.importKey("raw", bytes(guardada), "AES-GCM", false, ["decrypt"]);
      await abrir(llave);
    } catch {
      try { sessionStorage.removeItem(GUARDADA); } catch {}
    }
  })();

  form.addEventListener("submit", async e => {
    e.preventDefault();
    error.textContent = "";
    boton.disabled = true;
    boton.textContent = "Abriendo…";
    try {
      const llave = await llaveDesdeClave(document.getElementById("clave").value);
      await abrir(llave);
      try {
        const cruda = new Uint8Array(await crypto.subtle.exportKey("raw", llave));
        sessionStorage.setItem(GUARDADA, btoa(String.fromCharCode(...cruda)));
      } catch {}
    } catch {
      error.textContent = "Clave incorrecta.";
      boton.disabled = false;
      boton.textContent = "Entrar";
      document.getElementById("clave").select();
    }
  });
})();
</script>

<script>
// Cobro de servicios profesionales en Chile: cuánto paga el cliente, cuánto va al SII y cuánto
// recibes, según cómo cobras. Fuente canónica: ~/.claude/skills/cobro-servicios/componente/cobro.js.
// Copiar tal cual en cada proyecto (inline o como archivo) y no editar la copia: mejorar aquí.
//
// Regímenes:
//   boleta-cliente  Boleta de honorarios; el cliente (empresa) retiene y entera la retención al SII.
//   boleta-propia   Boleta de honorarios; el cliente te paga todo y tú pagas la retención en tu F29.
//   factura         Factura como empresa; el cliente paga el precio más IVA y tú declaras el IVA.
//
// El precio de lista es el precio sin IVA: en boleta es el monto bruto de la boleta.
//
// Marcado:
//   <script type="application/json" id="cobro-ajustes">{"regimen":…,"retencionPorAnio":{…},"iva":19}<\/script>
//     (Este archivo va inline en <script>: ningún comentario puede llevar la etiqueta de cierre sin escapar.)
//     Valores por defecto, copiados de ~/.claude/skills/cobro-servicios/ajustes.json.
//   <form data-cobro-selector> con radios name="regimen" y campos name="retencion" y name="iva".
//   <span data-monto="590000" data-ver="lista|cliente|sii|recibes|para-recibir"></span>
//     para-recibir: cuánto cobrar (precio de lista) para recibir ese monto.
//   [data-cobro-nombre]: nombre del régimen elegido.
//   [data-cobro-solo="boleta-cliente boleta-propia"]: visible solo con esos regímenes.
//   [data-cobro-dato="retencion|iva"]: el porcentaje vigente.
//
// El ajuste elegido se guarda en localStorage ("fearless-cobro-v1") y lo comparten todas las
// páginas del mismo dominio (por ejemplo, fearlessunlimited.github.io). La retención guardada vale
// solo para su año: al cambiar el año se usa la del calendario.
//
// API: Cobro.iniciar(raiz) enlaza y pinta lo que haya en raiz (se puede llamar varias veces);
// Cobro.calcular(precio) devuelve { lista, cliente, sii, recibes }; Cobro.paraRecibir(monto);
// Cobro.ajuste() devuelve { regimen, retencion, iva }. Cada cambio emite "cobro:cambio" en document.
(() => {
  const CLAVE = "fearless-cobro-v1";
  const NOMBRES = {
    "boleta-cliente": "Boleta de honorarios, retiene el cliente",
    "boleta-propia": "Boleta de honorarios, retengo yo",
    "factura": "Factura como empresa",
  };
  const anio = String(new Date().getFullYear());
  const pesos = n => "$" + Math.round(n).toLocaleString("es-CL");
  const pct = n => n.toLocaleString("es-CL", { maximumFractionDigits: 2 }) + "%";

  function porDefecto() {
    let base = {};
    try { base = JSON.parse(document.getElementById("cobro-ajustes")?.textContent || "{}"); } catch {}
    const tabla = base.retencionPorAnio || {};
    const anios = Object.keys(tabla).sort();
    const vigente = tabla[anio] ?? (anios.length ? tabla[anios.filter(a => a <= anio).pop() || anios[0]] : 15.25);
    return { regimen: NOMBRES[base.regimen] ? base.regimen : "boleta-cliente", retencion: vigente, iva: base.iva ?? 19 };
  }

  let estado = porDefecto();
  try {
    const guardado = JSON.parse(localStorage.getItem(CLAVE) || "null");
    if (guardado && NOMBRES[guardado.regimen]) estado.regimen = guardado.regimen;
    if (guardado?.anio === anio && Number.isFinite(guardado.retencion)) estado.retencion = guardado.retencion;
    if (Number.isFinite(guardado?.iva)) estado.iva = guardado.iva;
  } catch {}

  function guardar() {
    try { localStorage.setItem(CLAVE, JSON.stringify({ ...estado, anio })); } catch {}
  }

  function calcular(precio) {
    const p = Number(precio) || 0;
    if (estado.regimen === "factura") {
      const iva = p * estado.iva / 100;
      return { lista: p, cliente: p + iva, sii: iva, recibes: p };
    }
    const retencion = p * estado.retencion / 100;
    return { lista: p, cliente: p, sii: retencion, recibes: p - retencion };
  }

  function paraRecibir(monto) {
    const m = Number(monto) || 0;
    return estado.regimen === "factura" ? m : m / (1 - estado.retencion / 100);
  }

  function pintar(raiz = document) {
    raiz.querySelectorAll("[data-monto]").forEach(el => {
      const ver = el.dataset.ver || "lista";
      el.textContent = pesos(ver === "para-recibir" ? paraRecibir(el.dataset.monto) : calcular(el.dataset.monto)[ver]);
    });
    raiz.querySelectorAll("[data-cobro-nombre]").forEach(el => { el.textContent = NOMBRES[estado.regimen]; });
    raiz.querySelectorAll("[data-cobro-dato]").forEach(el => { el.textContent = pct(estado[el.dataset.cobroDato]); });
    raiz.querySelectorAll("[data-cobro-solo]").forEach(el => {
      el.hidden = !el.dataset.cobroSolo.split(/\s+/).includes(estado.regimen);
    });
    raiz.querySelectorAll("form[data-cobro-selector]").forEach(form => {
      const radio = form.querySelector(`input[name="regimen"][value="${estado.regimen}"]`);
      if (radio) radio.checked = true;
      for (const campo of ["retencion", "iva"]) {
        const input = form.elements[campo];
        if (input && document.activeElement !== input) input.value = estado[campo];
      }
    });
  }

  function cambiar(cambios) {
    Object.assign(estado, cambios);
    guardar();
    pintar();
    document.dispatchEvent(new CustomEvent("cobro:cambio", { detail: { ...estado } }));
  }

  const enlazados = new WeakSet();
  function iniciar(raiz = document) {
    raiz.querySelectorAll("form[data-cobro-selector]").forEach(form => {
      if (enlazados.has(form)) return;
      enlazados.add(form);
      form.addEventListener("submit", e => e.preventDefault());
      form.addEventListener("input", e => {
        const { name, value } = e.target;
        if (name === "regimen" && NOMBRES[value]) cambiar({ regimen: value });
        if (name === "retencion" || name === "iva") {
          const n = Number(String(value).replace(",", "."));
          if (Number.isFinite(n) && n >= 0 && n < 100) cambiar({ [name]: n });
        }
      });
      const restaurar = form.querySelector("[data-cobro-restaurar]");
      restaurar?.addEventListener("click", () => {
        const base = porDefecto();
        cambiar({ retencion: base.retencion, iva: base.iva });
      });
    });
    pintar(raiz);
  }

  window.Cobro = { iniciar, calcular, paraRecibir, ajuste: () => ({ ...estado }), nombres: NOMBRES, pesos };
})();
</script>
<script>
// Pestañas, cobro y calculadoras de los estudios. Va fuera del bloque protegido porque los scripts
// que llegan dentro del contenido descifrado no se ejecutan. Corre al cargar (vista previa sin
// cifrar) y cuando la página avisa que descifró el contenido.
(() => {
  const pesos = n => "$" + Math.round(n).toLocaleString("es-CL");

  function pestanas() {
    const enlaces = [...document.querySelectorAll(".tabs a[data-tab]")];
    const estudios = [...document.querySelectorAll(".estudio")];
    if (!estudios.length) return;
    // El id de cada estudio pasa a data-id para que el navegador no salte hasta el estudio al
    // cambiar de pestaña: lo maneja mostrar(). Las anclas internas (#veredicto) siguen nativas.
    estudios.forEach(e => { if (e.id) { e.dataset.id = e.id; e.removeAttribute("id"); } });
    function mostrar() {
      const id = decodeURIComponent(location.hash.slice(1));
      const porEstudio = estudios.find(e => e.dataset.id === id);
      const destino = porEstudio ? null : (id ? document.getElementById(id) : null);
      const estudio = porEstudio || destino?.closest(".estudio") || estudios[0];
      estudios.forEach(e => { e.hidden = e !== estudio; });
      enlaces.forEach(a => a.setAttribute("aria-current", a.dataset.tab === estudio.dataset.id ? "page" : "false"));
      if (destino) destino.scrollIntoView();
      else window.scrollTo({ top: 0, behavior: "instant" });
    }
    window.addEventListener("hashchange", mostrar);
    mostrar();
  }

  // Calculadora: cada <form data-calc> tiene campos con name y salidas <output data-out>.
  function calculadoras() {
    document.querySelectorAll("form[data-calc]").forEach(form => {
      const v = name => Number(String(form.elements[name]?.value ?? "").replace(",", ".")) || 0;
      const poner = (name, texto) => { const o = form.querySelector(`[data-out="${name}"] b`); if (o) o.textContent = texto; };
      function calcular() {
        const colchon = 1 + v("colchon") / 100;
        const puesta = (v("horas") * v("tarifa") + v("costosUnicos")) * colchon;
        const mantencion = (v("horasMes") * v("tarifa") + v("costosMes")) * colchon;
        const neto = v("pedidos") * v("ganancia") - mantencion;
        const cobro = window.Cobro.calcular(puesta);
        poner("puesta", pesos(puesta));
        poner("puestaCliente", pesos(cobro.cliente));
        poner("puestaRecibes", pesos(cobro.recibes));
        poner("mantencion", pesos(mantencion));
        poner("netoLocal", pesos(neto));
        poner("meses", neto > 0 ? (puesta / neto).toLocaleString("es-CL", { maximumFractionDigits: 1 }) + " meses" : "no se recupera");
      }
      form.addEventListener("input", calcular);
      document.addEventListener("cobro:cambio", calcular);
      form.addEventListener("submit", e => e.preventDefault());
      calcular();
    });
  }

  function iniciar() { window.Cobro.iniciar(); pestanas(); calculadoras(); }
  document.addEventListener("protegido:abierto", iniciar);
  if (document.querySelector(".estudio")) iniciar();
})();
</script>
