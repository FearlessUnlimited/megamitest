<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Documento interno de Fearless Unlimited.">
<meta name="robots" content="noindex">
<title>Plan de negocio Fearless</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: informe de una columna de lectura, protegido con clave. Antes de entrar se ve solo la tarjeta de acceso; el contenido va cifrado en la página y se descifra en el navegador. Mismo mundo visual que la landing y la propuesta. */
:root {
  color-scheme: dark;
  --ink: #0f0c0c;
  --ink-2: #181313;
  --ink-3: #241c1b;
  --line: #3b2d2b;
  --rice: #f3ece2;
  --muted: #ab9d93;
  --shu: #c0201c;
  --shu-hi: #ff6b5e;
  --ok: #6fcf8e;
  --mid: #e8b04a;
  --display: "Dela Gothic One", "Zen Kaku Gothic New", system-ui, sans-serif;
  --body: "Zen Kaku Gothic New", system-ui, -apple-system, "Segoe UI", sans-serif;
  --gutter: clamp(16px, 4vw, 40px);
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { margin: 0; background: var(--ink); color: var(--rice); font-family: var(--body); font-size: 17px; line-height: 1.65; -webkit-font-smoothing: antialiased; }
img { max-width: 100%; display: block; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; line-height: 1.12; text-wrap: balance; margin: 0; }
p { margin: 0; }
a { color: var(--shu-hi); }
:focus-visible { outline: 2px solid var(--shu-hi); outline-offset: 2px; }
.wrap { max-width: 1040px; margin-inline: auto; padding-inline: var(--gutter); }
.eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--shu-hi); font-weight: 700; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: color-mix(in srgb, var(--ink) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.bar .fu { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; color: var(--rice); text-decoration: none; }
.bar .fu img { width: 24px; height: 24px; }
.bar .spacer { flex: 1; }
.bar .back { font-size: 14px; font-weight: 700; text-decoration: none; border-radius: 999px; padding: 6px 14px; box-shadow: inset 0 0 0 1.5px var(--line); color: var(--rice); white-space: nowrap; }
.bar .back:hover { box-shadow: inset 0 0 0 1.5px var(--rice); }

.cover { padding-block: clamp(40px, 7vw, 88px) 40px; border-bottom: 1px solid var(--line); }
.cover h1 { font-size: clamp(32px, 5.6vw, 62px); max-width: 18ch; margin-top: 14px; }
.cover h1 em { font-style: normal; color: var(--shu-hi); }
.cover .lede { margin-top: 20px; font-size: clamp(17px, 2.1vw, 20px); color: var(--muted); max-width: 60ch; }
.cover .meta { margin-top: 20px; font-size: 14px; color: var(--muted); }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); border-bottom: 1px solid var(--line); }
.stats div { padding: 26px 20px 26px 0; display: grid; gap: 4px; align-content: start; }
.stats b { font-family: var(--display); font-weight: 400; font-size: clamp(28px, 3.6vw, 38px); line-height: 1.1; }
.stats span { color: var(--muted); font-size: 15px; }

section { padding-block: clamp(44px, 6vw, 80px); border-bottom: 1px solid var(--line); }
.sec-title { display: grid; gap: 10px; margin-bottom: 28px; }
.sec-title h2 { font-size: clamp(26px, 3.8vw, 40px); }
.sec-title p { color: var(--muted); max-width: 64ch; }

.findings { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 14px; }
.finding { background: var(--ink-2); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; display: grid; gap: 6px; align-content: start; }
.finding h3 { font-family: var(--body); font-weight: 700; font-size: 17px; }
.finding p { color: var(--muted); font-size: 15px; }

.ideas { display: grid; gap: 16px; }
.idea { background: var(--ink-2); border: 1px solid var(--line); border-radius: 14px; padding: clamp(18px, 3vw, 28px); display: grid; gap: 14px; }
.idea.fav { border-color: color-mix(in srgb, var(--shu) 60%, var(--line)); }
.idea .head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.idea h3 { font-size: clamp(20px, 2.6vw, 26px); flex: 1 1 260px; }
.tag { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 3px 10px; white-space: nowrap; background: var(--ink-3); color: var(--muted); }
.tag.fav { background: var(--shu); color: var(--rice); }
.v { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 3px 10px; white-space: nowrap; border: 1.5px solid currentColor; }
.v.alta { color: var(--ok); }
.v.media { color: var(--mid); }
.v.baja { color: var(--shu-hi); }
.idea .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px 28px; }
.idea h4 { margin: 0 0 6px; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.idea ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 15px; }
.idea li::marker { color: var(--shu-hi); }
.idea .rec { border-top: 1px dashed var(--line); padding-top: 12px; font-size: 15px; }
.idea .rec b { color: var(--shu-hi); }

.money { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 760px) { .money { grid-template-columns: 1fr; } }
.ledger { background: var(--ink-2); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 4px; align-content: start; }
.ledger.direct { border: 1.5px solid var(--shu); background: color-mix(in srgb, var(--shu) 8%, var(--ink)); }
.ledger h3 { font-size: 19px; margin-bottom: 8px; }
.ledger .row { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 15px; }
.ledger .row span:last-child { font-variant-numeric: tabular-nums; white-space: nowrap; }
.ledger .row.total { border-bottom: 0; font-weight: 700; font-size: 17px; }
.ledger .row.total span:last-child { font-family: var(--display); font-weight: 400; }
.ledger small { color: var(--muted); font-size: 13px; margin-top: 6px; }
.note { margin-top: 16px; color: var(--muted); font-size: 15px; max-width: 70ch; }

.phases { display: grid; gap: 14px; }
.phase { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 24px; background: var(--ink-2); border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
.phase .k { display: grid; gap: 4px; align-content: start; }
.phase .k b { font-family: var(--display); font-weight: 400; font-size: 15px; color: var(--shu-hi); }
.phase .k span { font-size: 13px; color: var(--muted); }
.phase h3 { font-size: 21px; margin-bottom: 8px; }
.phase p { color: var(--muted); }
.phase ul { margin: 12px 0 0; padding-left: 20px; display: grid; gap: 4px; font-size: 15px; }
.phase li::marker { color: var(--shu-hi); }
.phase.now { border-color: var(--shu); }
@media (max-width: 640px) { .phase { grid-template-columns: 1fr; gap: 10px; } }

.check { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 0 32px; padding: 0; margin: 0; list-style: none; }
.check li { padding: 12px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 26px 1fr; gap: 6px; }
.check li::before { content: "□"; color: var(--shu-hi); font-weight: 700; }
.check small { display: block; color: var(--muted); font-size: 14px; }

.sources { margin: 0; padding-left: 20px; display: grid; gap: 8px; font-size: 15px; color: var(--muted); }
.sources a { overflow-wrap: anywhere; }
footer { padding-block: 24px 40px; color: var(--muted); font-size: 13px; }

.acceso { min-height: calc(100dvh - 60px); display: grid; place-items: center; padding: 40px var(--gutter); }
.acceso form { width: min(100%, 380px); background: var(--ink-2); border: 1px solid var(--line); border-radius: 16px; padding: 28px 24px; display: grid; gap: 14px; }
.acceso h1 { font-size: 26px; }
.acceso p { color: var(--muted); font-size: 15px; }
.acceso label { font-size: 14px; font-weight: 700; }
.acceso input { width: 100%; font: inherit; color: var(--rice); background: var(--ink); border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.acceso input:focus { border-color: var(--rice); outline: none; }
.acceso button { font: inherit; font-weight: 700; color: var(--rice); background: var(--shu); border: 0; border-radius: 999px; padding: 12px 20px; cursor: pointer; }
.acceso button:disabled { opacity: .6; cursor: wait; }
.acceso .error { color: var(--shu-hi); font-size: 14px; min-height: 1.4em; }
</style>
</head>
<body>

<div class="bar">
  <div class="wrap">
    <a class="fu" href="negocio.html"><img src="img/fearless-unlimited.png" alt="" width="24" height="24">Fearless Unlimited</a>
    <span class="spacer"></span>
    <a class="back" href="./">← Volver a la landing</a>
  </div>
</div>

<div id="protegido">
<div class="acceso">
  <form id="formAcceso" autocomplete="off">
    <p class="eyebrow">Documento interno</p>
    <h1>Plan de negocio</h1>
    <p>Ingresa la clave para ver el documento.</p>
    <label for="clave">Clave</label>
    <input id="clave" type="password" autocomplete="current-password" required autofocus>
    <p class="error" id="errorAcceso" role="alert"></p>
    <button type="submit" id="entrar">Entrar</button>
  </form>
</div>
</div>

<script>
(() => {
  const paquete = JSON.parse(document.getElementById("paquete").textContent);
  const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const GUARDADA = "negocio-llave-v" + paquete.v + "-" + paquete.sal;
  const form = document.getElementById("formAcceso");
  const error = document.getElementById("errorAcceso");
  const boton = document.getElementById("entrar");

  async function abrir(llave) {
    const plano = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(paquete.iv) }, llave, bytes(paquete.datos));
    document.getElementById("protegido").outerHTML = new TextDecoder().decode(plano);
    if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
  }

  async function llaveDesdeClave(clave) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(clave), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt: bytes(paquete.sal), iterations: paquete.iter, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
  }

  if (!window.crypto?.subtle) {
    error.textContent = "Este navegador no puede abrir el documento. Ábrelo desde la dirección https del sitio.";
    boton.disabled = true;
    return;
  }

  (async () => {
    let guardada = null;
    try { guardada = sessionStorage.getItem(GUARDADA); } catch {}
    if (!guardada) return;
    try {
      const llave = await crypto.subtle.importKey("raw", bytes(guardada), "AES-GCM", false, ["decrypt"]);
      await abrir(llave);
    } catch {
      try { sessionStorage.removeItem(GUARDADA); } catch {}
    }
  })();

  form.addEventListener("submit", async e => {
    e.preventDefault();
    error.textContent = "";
    boton.disabled = true;
    boton.textContent = "Abriendo…";
    try {
      const llave = await llaveDesdeClave(document.getElementById("clave").value);
      await abrir(llave);
      try {
        const cruda = new Uint8Array(await crypto.subtle.exportKey("raw", llave));
        sessionStorage.setItem(GUARDADA, btoa(String.fromCharCode(...cruda)));
      } catch {}
    } catch {
      error.textContent = "Clave incorrecta.";
      boton.disabled = false;
      boton.textContent = "Entrar";
      document.getElementById("clave").select();
    }
  });
})();
</script>
